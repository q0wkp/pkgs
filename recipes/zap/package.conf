# Settings for this package, read by scripts/build.sh and scripts/publish.sh. The directory's name
# is the package's key in versions/ and its name in the README.

# Where releases are published.
SOURCE_REPO=q0wkp/zap
# The package's name in each repository; empty to leave that one out.
PACMAN_PACKAGE=zap
PACSTALL_PACKAGE=zap-deb
# Its file in the Homebrew tap, Casks/<token>.rb or Formula/<name>.rb, rendered from homebrew.rb.in;
# empty for none.
HOMEBREW=Casks/zap-terminal.rb
# build: makepkg runs PKGBUILD.in. prebuilt: the release already has a .pkg.tar.zst, as ASSETS PKG.
ARCH_MODE=prebuilt
# KEY=PATTERN for each release file to hash, where {version} is the tag without its v. The templates
# get @@ASSET_KEY@@ and @@SHA256_KEY@@. Each target is published once the release has the files its
# template names (PKG for a prebuilt pacman package), whatever the other targets still lack.
ASSETS=(DEB=*amd64.deb PKG=*x86_64.pkg.tar.zst MAC_ARM64=zap-{version}-macos-aarch64.dmg MAC_X86_64=zap-{version}-macos-x86_64.dmg)
# true when the templates build from GitHub's tag tarball, for @@SHA256_SOURCE@@.
SOURCE_TARBALL=false
# Last column of the package list in the repository's README.
README_NOTES=x86_64\ on\ Linux\,\ Apple\ silicon\ and\ Intel\ on\ macOS
# A command that checks the installed program works, run by scripts/verify.sh after installing it
# (not for a cask, whose app can't be run headless); empty for none. Example: zmx version
VERIFY_COMMAND=
